version: 2

updates:
  # Dependabot raises no security alerts for SHA-pinned actions, only for
  # semver ones, so this schedule is the sole mechanism that carries an
  # upstream fix in. Weekly, not monthly, for that reason. The trailing
  # "# vX.Y.Z" beside each pin is updated along with the SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      # Majors land in their own PR, so a breaking bump never arrives wearing
      # a routine title. Deliberately not ignored: if a fix ships only in a
      # new major, ignoring majors would reopen the hole the pinning closed.
      actions-major:
        patterns:
          - "*"
        update-types:
          - major
      actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
